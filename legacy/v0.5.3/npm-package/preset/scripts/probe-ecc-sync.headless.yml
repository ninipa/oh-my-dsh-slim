# Zero-cost runtime contract probe for the early-close-context live inbox path
# NOTE: run through scripts/run-host-probes.mjs (substitutes __WORKSPACE__); direct copy-paste needs the token replaced.
# (PLAN-DELEGATION-LIFECYCLE verification step 4.5, synthetic-injection form):
#   - stock headless tree, headless runner replaced by the probe;
#   - preset mounted from the scratch home's .agent-presets roster;
#   - probe creates one real preset agent (real plugin composition incl.
#     early-close-context), injects host-identical delivery sources into its
#     live inbox, and asserts the host event contract ECC relies on
#     (event name / fused agent payload / source round-trip / no listener
#     throw / durable splice replay visibility). NEVER sends a model request.
# Usage (scratch home must contain the preset under .agent-presets/):
#   DSH_HOME=<scratch> dsh --profile headless \
#     --patch scripts/probe-ecc-sync.headless.yml probe
- insert:
    - id: agent-presets
      name: '@deepseek-ai/dsh-agent-presets'
      config:
        default: oh-my-dsh-slim
- id: headless-runner
  disabled: true
- insert:
    - id: probe-ecc-sync
      name: file://__WORKSPACE__/scripts/probe-ecc-sync.js
