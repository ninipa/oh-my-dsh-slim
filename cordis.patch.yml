# oh-my-dsh-slim bundle patch (repository manifest)
#
# DSH 0.2.0 loads agent presets declaratively: a bundle patch inserts an
# `@deepseek-ai/dsh-agent-preset` row whose `config.plugins` IS the preset. This
# row IS the preset "oh-my-dsh-slim" — there is no directory under
# $DSH_HOME/.agent-presets and nothing is copied at runtime.
#
# Install:
#   dsh plugin --profile <non-desktop-profile> add oh-my-dsh-slim@0.6.1-native.3
# Use this spec after publication by ninipa/oh-my-dsh-slim; before release,
# install an explicitly reviewed commit, never a moving development branch.
# Desktop installs/updates are managed only through its plugin manager.
# or add this repository's path to the profile's `dsh.profile.bundles`. Either
# way the loader mounts preset row below plus the companion row that reports
# what was registered.
#
# The preset itself is a JS module: the loader reaches a row's plugin with
# import(), so this row may name a .js file (or a bare package) but never a .yml
# one. preset.js returns the same bundle patch shape this file has.
#
# The shipped npm package (oh-my-dsh-slim on npmjs, built from npm-package/)
# carries the same declaration one directory lower; test/package.test.mjs
# verifies that the two stay in step.
- insert:
    - id: preset-oh-my-dsh-slim
      name: './npm-package/preset/preset.js'
    - id: oh-my-dsh-slim-profiles
      name: './npm-package/lib/profile-registry.js'
    - id: oh-my-dsh-slim
      name: './npm-package/lib/index.js'
