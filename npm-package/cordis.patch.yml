# oh-my-dsh-slim bundle patch (published package)
#
# Same declaration as the repository-root cordis.patch.yml. Exported package
# subpaths keep non-client rows out of the host's client-package scan, while
# the bare root companion declares the client once. When the package is
# installed with (after publication by ninipa/oh-my-dsh-slim)
#   dsh plugin --profile <non-desktop-profile> add oh-my-dsh-slim@0.6.1
# Use the desktop plugin manager for desktop installs. Before publication,
# use an explicitly reviewed commit, not a moving development branch.
# The loader appends these rows and the preset mounts with the rest of the tree.
#
# test/package.test.mjs in the repository keeps this file and the repository
# root copy in step.
- insert:
    - id: preset-oh-my-dsh-slim
      name: 'oh-my-dsh-slim/preset'
    - id: oh-my-dsh-slim-profiles
      name: 'oh-my-dsh-slim/profile-registry'
    - id: oh-my-dsh-slim
      name: 'oh-my-dsh-slim'
