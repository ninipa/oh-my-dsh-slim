# Zero-cost model-modality probe: boots the tree and lists every provider's
# models with their declared inputModalities (text/image/...). Never sends a
# model request. Run this FIRST after any DSH upgrade.
#
# BEFORE RUNNING: replace REPLACE_WITH_REPO_ABS_PATH with this repo's absolute
# path (see probe-patch.headless.yml for a sed one-liner).
#
# Usage:
#   DSH_HOME=<scratch> dsh --profile headless --patch scripts/probe-capabilities-patch.headless.yml probe
- id: headless-runner
  disabled: true
- insert:
    - id: probe-model-capabilities
      name: file://REPLACE_WITH_REPO_ABS_PATH/scripts/probe-model-capabilities.js
