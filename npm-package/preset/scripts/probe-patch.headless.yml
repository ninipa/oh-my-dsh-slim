# Zero-cost host API probe overlay (PLAN-BACKGROUND-DELEGATION 方案 4 步骤 0):
# NOTE: run through scripts/run-host-probes.mjs (substitutes __WORKSPACE__); direct copy-paste needs the token replaced.
# disable the stock headless runner and replace it with probe-session-query,
# which boots the composition, probes ctx.sessionQuery / subagents APIs,
# validates the installed preset's role toolFilters against the real registry
# (compat section), and exits without ever sending a model request.
# Run with a scratch DSH_HOME that has the preset installed:
#   cp -r <preset> $DSH_HOME/.agent-presets/oh-my-dsh-slim   (no .git)
#   DSH_HOME=<scratch> dsh --profile headless --patch scripts/probe-patch.headless.yml probe
- insert:
    - id: agent-presets
      name: '@deepseek-ai/dsh-agent-presets'
      config:
        default: oh-my-dsh-slim
- id: headless-runner
  disabled: true
- insert:
    - id: probe-session-query
      name: file://__WORKSPACE__/scripts/probe-session-query.js
